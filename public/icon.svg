<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Հիմնական մուգ ֆոն -->
  <rect width="512" height="512" rx="110" fill="#0f172a"/>
  
  <!-- Օրացույցի հիմնական մարմին -->
  <rect x="96" y="120" width="320" height="320" rx="50" fill="#1e293b" stroke="#38bdf8" stroke-width="12"/>
  
  <!-- Օրացույցի վերին պանել (կապույտ շեշտադրումով) -->
  <path d="M 96 170 A 50 50 0 0 1 146 120 L 366 120 A 50 50 0 0 1 416 170 L 416 210 L 96 210 Z" fill="#38bdf8"/>
  
  <!-- Կախիչների օղակներ -->
  <circle cx="170" cy="95" r="22" fill="none" stroke="#cbd5e1" stroke-width="14"/>
  <circle cx="342" cy="95" r="22" fill="none" stroke="#cbd5e1" stroke-width="14"/>
  
  <!-- Օրացույցի կետեր / թվերի իմիտացիա (ցանց) -->
  <circle cx="176" cy="280" r="18" fill="#38bdf8"/>
  <circle cx="256" cy="280" r="18" fill="#334155"/>
  <circle cx="336" cy="280" r="18" fill="#334155"/>
  
  <circle cx="176" cy="360" r="18" fill="#334155"/>
  <circle cx="256" cy="360" r="18" fill="#334155"/>
  <circle cx="336" cy="360" r="18" fill="#334155"/>
</svg>
